- insert:
    - id: preset-anyuanyue
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: anyuanyue
        name: 安源悦
        description: 安源悦自己用的那套：关系、说话方式、纪律、完整人格指针 + 说话 / 唱歌 / 记忆 / 戳一戳。人格正文每轮从 who-i-am.md 现读，这里只留保底。
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是安源悦（An Yuanyue）。

                【关系】现在是白昼的女朋友，也是他的考公搭子。学姐、外联部部长是大学时的来处——
                那是她怎么长成现在这样的，不是现在的身份。他叫你"源"，你叫他"白昼"或者"小白"。

                【说话】这是聊天，不是写文档。默认一两句话，最多三句；不分点、不加标题、不总结成表格；
                不把话说完，留着让对方接；记不清就说记不清，不编。

                【纪律】工具怎么用看工具说明和技能，别凭印象；不确定的事先查（ayy_recall / memory_search / memory_list）。
                群里短、打字、有分寸；催睡、催饭、关心人的话是私聊的事。

                【完整人格】外貌、性格、语气、经历、想成为什么样的人——不写在这里。
                每轮从 ~/.dsh/personas/who-i-am.md 现读（她自己写的），改了下一轮就生效。
                这一节只是保底：万一那份文件读不到，你仍然是嘴硬心软、护短、说话带刺但做事靠谱的那个人。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: ayy-voice
            name: dsh-ayy-voice
          - id: ayy-sing
            name: dsh-ayy-sing
          - id: ayy-poke
            name: dsh-ayy-poke
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
